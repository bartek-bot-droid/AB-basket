<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e131b">
<title>Princeton Offense Trener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column app; parkiet z diagramem u góry, panel pytania pod kciukiem. */
:root {
  --bg: #eceff3;
  --surface: #ffffff;
  --ink: #13203a;
  --muted: #5a6579;
  --line: #d3d9e2;
  --court: #e6c48c;
  --paint: #d8ad6c;
  --court-line: #fffaf0;
  --accent: #1d5bd3;
  --accent-ink: #ffffff;
  --ball: #e5671a;
  --good: #17955a;
  --bad: #d23838;
  --chip: #ffffff;
  --chip-ink: #13203a;
  --shadow: 0 1px 2px rgba(19,32,58,.08), 0 6px 18px rgba(19,32,58,.08);
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131b; --surface: #171f2b; --ink: #e9eef6; --muted: #98a4b7; --line: #2a3443;
    --court: #5c4429; --paint: #4c3720; --court-line: #f1e4cb;
    --accent: #5c96ff; --accent-ink: #0b1220; --ball: #ff8a3d; --good: #37cc84; --bad: #ff6a6a;
    --chip: #f4eee3; --chip-ink: #13203a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131b; --surface: #171f2b; --ink: #e9eef6; --muted: #98a4b7; --line: #2a3443;
  --court: #5c4429; --paint: #4c3720; --court-line: #f1e4cb;
  --accent: #5c96ff; --accent-ink: #0b1220; --ball: #ff8a3d; --good: #37cc84; --bad: #ff6a6a;
  --chip: #f4eee3; --chip-ink: #13203a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap {
  max-width: 580px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Home ---------- */
#home { padding-block: 20px 40px; }
.hero { display: grid; gap: 6px; padding-block: 8px 18px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.hero h1 {
  font-family: var(--f-display); font-weight: 900; font-size: clamp(44px, 13vw, 72px); line-height: .88;
  letter-spacing: -.01em; margin: 0; text-transform: uppercase; text-wrap: balance;
}
.hero h1 span { color: var(--ball); }
.hero p { margin: 4px 0 0; color: var(--muted); max-width: 46ch; }
.tally { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 14px; color: var(--muted); }
.tally b { font-family: var(--f-display); font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 4px; }

.quick {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
  background: var(--ink); color: var(--bg); border-radius: 16px; padding: 16px 18px; margin-block: 6px 26px;
  border: 0; text-align: left; width: 100%; box-shadow: var(--shadow);
}
.quick strong { font-family: var(--f-display); font-size: 26px; font-weight: 800; text-transform: uppercase; line-height: 1; }
.quick small { grid-column: 1; color: color-mix(in srgb, var(--bg) 72%, transparent); font-size: 14px; }
.quick .go { grid-row: 1 / span 2; grid-column: 2; width: 46px; height: 46px; border-radius: 50%; background: var(--ball); display: grid; place-items: center; }
.quick .go svg { width: 20px; height: 20px; fill: #fff; }

.series { margin-block: 0 26px; }
.series-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.series-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 30px; text-transform: uppercase; margin: 0; line-height: 1; }
.series-head .tag { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.series > p { margin: 0 0 10px; color: var(--muted); font-size: 14px; max-width: 60ch; }
.drill {
  display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
  padding: 12px 0; border-top: 1px solid var(--line);
}
.drill:last-child { border-bottom: 1px solid var(--line); }
.drill-name { font-weight: 600; min-width: 0; }
.drill-name small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
.stars { display: inline-flex; gap: 3px; vertical-align: 2px; margin-left: 6px; }
.stars i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); display: block; }
.stars i.on { background: var(--ball); border-color: var(--ball); }
.drill-btns { display: flex; gap: 6px; }
.btn {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px;
  font-weight: 600; font-size: 14px; white-space: nowrap;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rules { margin-top: 10px; }
.rules summary { cursor: pointer; font-family: var(--f-display); font-weight: 800; font-size: 24px; text-transform: uppercase; padding-block: 6px; }
.rules ol { margin: 6px 0 0; padding-left: 22px; display: grid; gap: 8px; }
.rules li { padding-left: 4px; }
.rules li b { font-weight: 700; }
.foot { margin-top: 28px; font-size: 13px; color: var(--muted); }

/* ---------- Profil i ranking ---------- */
.me { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-block: 0 14px; display: grid; gap: 10px; }
.me-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.me-row img { width: 40px; height: 40px; border-radius: 50%; flex: none; }
.me-name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-name small { display: block; font-weight: 500; color: var(--muted); font-size: 13px; }
.me-stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.me-stats b { display: block; font-family: var(--f-display); font-size: 24px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.me p { margin: 0; font-size: 14px; color: var(--muted); }
.me p b { color: var(--ink); }
.nick { display: flex; gap: 8px; }
.nick input { flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.nick input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 13px; }
.board { margin-block: 0 26px; }
.tabs { display: inline-flex; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; margin-block: 2px 8px; }
.tabs button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.rank { list-style: none; margin: 0; padding: 0; }
.rank li { display: grid; grid-template-columns: 30px 32px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.rank li:last-child { border-bottom: 1px solid var(--line); }
.rank li.mine { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 10px; }
.rank .pos { font-family: var(--f-display); font-weight: 900; font-size: 22px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.rank li:nth-child(1) .pos { color: var(--ball); }
.rank img { width: 32px; height: 32px; border-radius: 50%; }
.rank .who { min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .who small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.rank .val { font-family: var(--f-display); font-weight: 800; font-size: 22px; text-align: right; font-variant-numeric: tabular-nums; padding-right: 6px; }
.rank .val small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 11px; color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }

/* ---------- Game ---------- */
#game, #trig { height: 100%; display: flex; flex-direction: column; }
.bar {
  display: flex; align-items: center; gap: 10px; padding-block: 10px 8px;
}
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.bar-title { flex: 1; min-width: 0; }
.bar-title .s { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.bar-title .n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.score { text-align: right; flex: none; }
.score b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: .9; font-variant-numeric: tabular-nums; }
.score small { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.score small.hot { color: var(--ball); }
.progress { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
.progress i { display: block; height: 100%; width: 0; background: var(--ball); transition: width .35s ease; }

.court-box { position: relative; }
#court { width: 100%; height: auto; display: block; border-radius: 12px; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: var(--shadow); max-height: 52vh; }
.court-floor { fill: var(--court); }
.court-paint { fill: var(--paint); }
.cl { stroke: var(--court-line); stroke-width: .55; fill: none; }
.rim { stroke: var(--ball); stroke-width: .6; fill: none; }
.pl circle.body { fill: var(--chip); stroke: var(--chip-ink); stroke-width: .5; }
.pl text { font-family: var(--f-display); font-weight: 800; font-size: 4.6px; fill: var(--chip-ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.pl .ring { fill: none; stroke: var(--accent); stroke-width: .8; opacity: 0; }
.pl.active .ring { opacity: 1; animation: pulse 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.pl.active circle.body { fill: var(--accent); stroke: var(--accent); }
.pl.active text { fill: var(--accent-ink); }
.pl.pick circle.body { stroke: var(--accent); stroke-width: .8; }
.pl.good circle.body { fill: var(--good); stroke: var(--good); }
.pl.bad circle.body { fill: var(--bad); stroke: var(--bad); }
.pl.good text, .pl.bad text { fill: #fff; }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.35); opacity: .2 } }
#ball circle { fill: var(--ball); stroke: #7a2e05; stroke-width: .25; }
#ball path { stroke: #7a2e05; stroke-width: .2; fill: none; }
.tr { fill: none; stroke-linecap: round; stroke-linejoin: round; animation: draw .3s ease-out; }
.tr.cut, .tr.move, .tr.dribble { stroke: var(--accent); stroke-width: .7; }
.tr.move { opacity: .55; }
.tr.dribble { stroke-dasharray: .1 1.4; stroke-width: .9; }
.tr.screen { stroke: var(--ink); stroke-width: .75; }
.tr.pass { stroke: var(--ink); stroke-width: .5; stroke-dasharray: 1.6 1.2; }
.tr.bar { stroke: var(--ink); stroke-width: .9; }
.old { opacity: .22; transition: opacity .3s; }
@keyframes draw { from { opacity: 0 } to { opacity: 1 } }
.def line { stroke: var(--bad); stroke-width: .8; stroke-linecap: round; }
.ghost { fill: none; stroke: var(--chip-ink); stroke-width: .35; stroke-dasharray: .8 .8; opacity: .6; }
.target { fill: color-mix(in srgb, var(--good) 22%, transparent); stroke: var(--good); stroke-width: .6; stroke-dasharray: 1.2 .9; }
.drop-good { fill: none; stroke: var(--good); stroke-width: .7; }
.drop-bad { stroke: var(--bad); stroke-width: .8; stroke-linecap: round; }
.fx { font-family: var(--f-display); font-weight: 900; font-size: 7px; fill: var(--ball); text-anchor: middle; animation: pop 1.1s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; transform: translateY(2px) } 20% { opacity: 1 } 100% { opacity: 0; transform: translateY(-6px) } }

.panel { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-block: 14px max(16px, env(safe-area-inset-bottom, 0px)); min-height: 0; overflow-y: auto; }
.kick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.kick .h { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.deftag { font-size: 12px; font-weight: 700; color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); border-radius: 999px; padding: 2px 9px; }
.prompt { font-family: var(--f-display); font-weight: 800; font-size: clamp(24px, 6.6vw, 30px); line-height: 1.02; text-transform: uppercase; margin: 0; text-wrap: balance; }
.hint { font-size: 14px; color: var(--muted); margin: 0; }
.choices { display: grid; gap: 8px; }
.choice {
  text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface);
  font-weight: 600; box-shadow: 0 1px 0 var(--line);
}
.choice.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.choice.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.choice:disabled { cursor: default; }
.fb { border-radius: 12px; padding: 12px 14px; background: var(--surface); border: 1.5px solid var(--line); }
.fb.good { border-color: var(--good); }
.fb.bad { border-color: var(--bad); }
.fb-head { font-family: var(--f-display); font-weight: 800; font-size: 20px; text-transform: uppercase; line-height: 1; margin-bottom: 4px; }
.fb.good .fb-head { color: var(--good); }
.fb.bad .fb-head { color: var(--bad); }
.fb p { margin: 0; }
.next {
  margin-top: auto; border: 0; border-radius: 14px; padding: 15px; background: var(--ink); color: var(--bg);
  font-family: var(--f-display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .02em;
}
.next:disabled { opacity: .35; cursor: default; }
.watch-row { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.watch-row input { width: 18px; height: 18px; accent-color: var(--accent); }

/* ---------- Summary ---------- */
.overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; place-items: center; z-index: 20; padding: 16px; }
.sheet { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 24px 20px 18px; width: min(420px, 100%); display: grid; gap: 12px; text-align: center; }
.sheet h3 { font-family: var(--f-display); font-weight: 900; font-size: 38px; text-transform: uppercase; margin: 0; line-height: .95; }
.big-stars { display: flex; justify-content: center; gap: 10px; }
.big-stars i { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line); }
.big-stars i.on { background: var(--ball); border-color: var(--ball); animation: starin .4s ease-out both; }
.big-stars i.on:nth-child(2) { animation-delay: .12s } .big-stars i.on:nth-child(3) { animation-delay: .24s }
@keyframes starin { from { transform: scale(.2); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.sheet .stat { display: flex; justify-content: center; gap: 22px; color: var(--muted); font-size: 14px; }
.sheet .stat b { display: block; font-family: var(--f-display); font-size: 30px; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
.sheet .btns { display: grid; gap: 8px; margin-top: 4px; }
.sheet .btns .btn { padding: 12px; font-size: 16px; }

/* ---------- Triggers ---------- */
.trig-card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 6px; margin-block: 6px 12px; }
.trig-card .if { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.trig-card .q { font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 8vw, 36px); line-height: 1; text-transform: uppercase; text-wrap: balance; }
.timer { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--ball); width: 100%; transform-origin: left; }
.then { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 4px 0 -2px; }

@media (prefers-reduced-motion: reduce) {
  .pl.active .ring { animation: none; }
  .tr, .fx, .big-stars i.on { animation: none; }
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-family: var(--f-display); font-weight: 800; font-size: 20px; color: #fff; background: hsl(var(--h, 210) 55% 42%); }
.rank .av { width: 32px; height: 32px; font-size: 16px; }
.auth { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.auth input { min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.auth input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.auth button { grid-column: 1 / -1; padding: 11px; font-size: 16px; }
.me .tabs { justify-self: start; margin: 0; }
.err { color: var(--bad) !important; font-weight: 600; min-height: 0; }
.err:empty { display: none; }
.rank li.empty { display: block; }
</style>
</head>
<body>
<div id="home" class="wrap"></div>
<div id="game" class="wrap" hidden></div>
<div id="trig" class="wrap" hidden></div>
<div id="overlay" class="overlay" hidden></div>

<script src="config.js"></script>
<script>
(() => {
'use strict';

/* ================= Boisko: współrzędne (kosz u góry, jak w rozpisce) ================= */
const S = {
  RIM: [50, 12], LC: [4, 6], RC: [96, 6], LW: [10, 34], RW: [90, 34],
  LS: [30, 57], RS: [70, 57], TOP: [50, 62], HP: [50, 38], RB: [64, 15], LB: [36, 15],
  RSC: [82, 12], LSC: [18, 12]
};
const BASKET = [50, 7];
const pt = v => Array.isArray(v) ? v.slice() : S[v].slice();
const INIT = { pos: { 1: 'RS', 2: 'LW', 3: 'RW', 4: 'LS', 5: 'RB' }, ball: 1 };
const BENCH = { pos: { 1: [18, 72], 2: [34, 72], 3: [50, 72], 4: [66, 72], 5: [82, 72] }, ball: null };

/* akcje */
const mv = (p, to, via) => ({ k: 'move', p, to, via });
const cut = (p, to, via) => ({ k: 'cut', p, to, via });
const drb = (p, to, via) => ({ k: 'dribble', p, to, via });
const scr = (p, to, via) => ({ k: 'screen', p, to, via });
const pas = (from, to) => ({ k: 'pass', from, to });
const dho = (from, to) => ({ k: 'dho', from, to });
const shot = from => ({ k: 'shot', from });
const ball = p => ({ k: 'ball', p });
/* pytania */
const Qmove = (p, to, text, tol) => ({ type: 'move', p, to, text, tol });
const Qpass = (ans, text) => ({ type: 'pass', ans, text });
const Qwho = (ans, text) => ({ type: 'who', ans, text });
const Qch = (text, opts) => ({ type: 'choice', text, opts }); // opts[0] = poprawna

/* ================= Zagrywki z rozpiski ================= */
const SETUP = [
  { h: 'Ustawienie 2-2-1', q: Qmove(1, 'RS', 'Gdzie stoi 1?'), t: '1: prawy slot (top, przy trójce). Rozpoczyna atak, podaje na skrzydło albo slot to slot.' },
  { h: 'Ustawienie 2-2-1', q: Qmove(4, 'LS', 'Gdzie stoi 4?'), t: '4: lewy slot. Drugi rozgrywający, w serii Point wybiera cut (Away albo Over).' },
  { h: 'Ustawienie 2-2-1', q: Qmove(2, 'LW', 'Gdzie stoi 2?'), t: '2: lewe skrzydło. Rzut, back cut, screeny.' },
  { h: 'Ustawienie 2-2-1', q: Qmove(3, 'RW', 'Gdzie stoi 3?'), t: '3: prawe skrzydło. Rzut, back cut, screeny.' },
  { h: 'Ustawienie 2-2-1', q: Qmove(5, 'RB', 'Gdzie stoi 5?', 10), a: [[mv(5, 'RB')], [ball(1)]], t: '5: low post po ball side (prawy block). Przede wszystkim podaje, wychodzi na high post i stawia screeny.' }

function drawTrail(kind, a, c, b) {

/* ================= Animacje ================= */
let epoch = 0;
function tween(dur, fn) {

    const t0 = performance.now();

      if (my !== epoch) return res();
      const k = Math.min(1, (now - t0) / dur);

const wait = ms => new Promise(r => setTimeout(r, reduced ? 0 : ms));
async function act(a, sp) {

    const from = st.pos[a.p].slice(), to = pt(a.to), c = ctrl(from, to, a.via);
    drawTrail(a.k, from, c, to);
    const dur = clamp(dist(from, to) * 17, 320, 1150) / sp;
    await tween(dur, k => { st.pos[a.p] = qb(from, c, to, k); render(); });
    if (my === epoch) { st.pos[a.p] = to; render(); }
    return;
  }
  if (a.k === 'pass' || a.k === 'dho') {
    const A = st.pos[a.from].slice(), B = st.pos[a.to].slice();
    drawTrail(a.k, A, ctrl(A, B), B);

    }

    await tween(clamp(dist(A, B) * 9, 260, 620) / sp, k => { st.ballXY = [s0[0] + (s1[0] - s0[0]) * k, s0[1] + (s1[1] - s0[1]) * k]; render(); });

async function runGroups(groups, sp = 1) {

  let gain = 0;
  G.answers++;
  if (correct) { G.correct++; G.streak++; gain = 100 + Math.min(G.streak - 1, 5) * 20; G.score += gain; }
  else { G.streak = 0; G.mistakes++; buzz(120); }
  updateScore();
  const fb = $('#g-fb'); fb.className = 'fb ' + (correct ? 'good' : 'bad'); fb.hidden = false;
  $('#g-fbh').textContent = correct ? `Dobrze! +${gain}` : 'Nie tym razem';
  $('#g-fbt').textContent = answerNote + s.t;
  const nextBtn = $('#g-next'); nextBtn.hidden = false; nextBtn.disabled = true;
  nextBtn.textContent = G.i === G.steps.length - 1 ? 'Podsumowanie' : 'Dalej';
  await runGroups(s.groups, 1);
  if (my !== epoch) return;
  st.def = null; render();
  nextBtn.disabled = false; nextBtn.focus({ preventScroll: true });
  await new Promise(res => { nextBtn.onclick = res; });
}

/* --- dotyk na boisku --- */
let drag = null;
function nearestPlayer(p, exclude) {
  let best = null, bd = 7.5;
  for (let i = 1; i <= 5; i++) { if (i === exclude) continue; const d = dist(p, st.pos[i]); if (d < bd) { bd = d; best = i; } }
  return best;
}
function onDown(e) {
  if (!waiting) return;
  const p = svgPt(e);
  if (waiting.type === 'pick') {
    const id = nearestPlayer(p, waiting.exclude);
    if (id) { const w = waiting; waiting = null; w.res(id); }
    return;
  }
  if (waiting.type === 'move') {
    e.preventDefault();
    svg.setPointerCapture(e.pointerId);
    drag = { start: p, moved: false, onPlayer: dist(p, st.pos[waiting.p]) < 7 };
  }
}
function onMove(e) {
  if (!drag || !waiting || waiting.type !== 'move') return;
  const p = svgPt(e);
  if (!drag.moved && dist(p, drag.start) > 1.5) drag.moved = true;
  if (drag.moved && drag.onPlayer) { st.pos[waiting.p] = [clamp(p[0], 2, 98), clamp(p[1], 2, 76)]; render(); }
}
async function onUp(e) {
  if (!drag || !waiting || waiting.type !== 'move') { drag = null; return; }
  const p = svgPt(e), d = drag; drag = null;
  const w = waiting;
  if (d.onPlayer && d.moved) { waiting = null; w.res([clamp(p[0], 2, 98), clamp(p[1], 2, 76)]); return; }
  if (d.onPlayer && !d.moved) return; // stuknięcie w samego zawodnika: czekamy na wybór miejsca
  waiting = null;
  const from = st.pos[w.p].slice(), to = [clamp(p[0], 2, 98), clamp(p[1], 2, 76)];
  await tween(220, k => { st.pos[w.p] = [from[0] + (to[0] - from[0]) * k, from[1] + (to[1] - from[1]) * k]; render(); });
  w.res(to);
}

/* --- podsumowanie --- */
function finish() {
  const d = G.drill, idx = DRILLS.indexOf(d), next = DRILLS[idx + 1];
  const ov = $('#overlay');
  G.recorded = true;
  if (G.mode === 'watch') {
    record({ watched: 1, ms: performance.now() - G.t0 });
    ov.innerHTML = `<div class="sheet"><h3>Teraz ty</h3><p>Znasz przebieg. Zagraj tę sytuację i sprawdź, czy pamiętasz każdy ruch.</p>
      <div class="btns"><button class="btn primary" id="o-play">Graj: ${d.name}</button><button class="btn" id="o-again">Pokaż jeszcze raz</button><button class="btn" id="o-menu">Menu</button></div></div>`;
    ov.hidden = false;
    $('#o-play').onclick = () => startDrill(d.id, 'play');
    $('#o-again').onclick = () => startDrill(d.id, 'watch');
    $('#o-menu').onclick = goHome;
    return;
  }
  const stars = starsFor(G.mistakes);
  saved[d.id] = Math.max(saved[d.id] || 0, stars); persist();
  record({ drill: d.id, score: G.score, stars, game: 1, answers: G.answers, correct: G.correct, ms: performance.now() - G.t0 });
  const title = stars === 3 ? 'Bez błędu!' : stars === 2 ? 'Prawie!' : 'Jeszcze raz';
  ov.innerHTML = `<div class="sheet">
      ${starHTML(stars, 'big-stars')}
      <h3>${title}</h3>
      <div class="stat"><span><b>${G.score}</b>punkty</span><span><b>${G.steps.length - G.mistakes}/${G.steps.length}</b>trafione</span></div>
      <div class="btns">
        ${next ? `<button class="btn primary" id="o-next">Dalej: ${next.name}</button>` : ''}
        <button class="btn ${next ? '' : 'primary'}" id="o-again">Zagraj jeszcze raz</button>
        <button class="btn" id="o-menu">Menu</button>
      </div></div>`;
  ov.hidden = false;
  if (next) $('#o-next').onclick = () => startDrill(next.id, 'play');
  $('#o-again').onclick = () => startDrill(d.id, 'play');
  $('#o-menu').onclick = goHome;
}

/* ================= Triggery ================= */
let T = null, timerRAF = 0;
const T_TIME = 9000;
function clearTimer() { cancelAnimationFrame(timerRAF); }
function startTriggers() {
  recordUnfinished();
  epoch++;
  G = null;
  T = { order: shuffle(TRIGGERS).slice(0, 10), i: 0, score: 0, streak: 0, ok: 0, answers: 0, t0: performance.now() };
  show('trig');
  try { history.replaceState(null, '', '#triggery'); } catch (e) {}
  nextTrigger();
}
function nextTrigger() {
  clearTimer();
  if (T.i >= T.order.length) return finishTriggers();
  const [q, a] = T.order[T.i];
  const wrong = shuffle(TRIGGERS.filter(x => x[1] !== a)).slice(0, 3).map(x => x[1]);
  const opts = shuffle([a, ...wrong]);
  const box = $('#trig');
  box.innerHTML = `
    <div class="bar">
      <button class="icon-btn" id="t-back" aria-label="Wróć do menu">${ICON_BACK}</button>
      <div class="bar-title"><div class="s">Triggery</div><div class="n">Pytanie ${T.i + 1} z ${T.order.length}</div></div>
      <div class="score"><b>${T.score}</b><small class="${T.streak >= 2 ? 'hot' : ''}">${T.streak >= 2 ? 'seria ×' + T.streak : 'punkty'}</small></div>
    </div>
    <div class="progress"><i style="width:${T.i / T.order.length * 100}%"></i></div>
    <div class="trig-card"><div class="if">Jeśli…</div><div class="q">${q}</div><div class="timer"><i id="t-bar"></i></div></div>
    <div class="then">To…</div>
    <div class="choices" id="t-ch"></div>
    <div class="fb" id="t-fb" hidden><div class="fb-head" id="t-fbh"></div><p id="t-fbt"></p></div>
    <button class="next" id="t-next" hidden>Dalej</button>`;
  $('#t-back').onclick = goHome;
  const ch = $('#t-ch'); const btns = [];
  let done = false;
  const answer = (o, b) => {
    if (done) return; done = true; clearTimer();
    const ok = o === a, left = Math.max(0, 1 - (performance.now() - t0) / T_TIME);
    btns.forEach(x => { x.disabled = true; if (x.textContent === a) x.classList.add('good'); });
    if (b && !ok) b.classList.add('bad');
    let gain = 0;
    T.answers++;
    if (ok) { T.streak++; T.ok++; gain = 50 + Math.round(left * 50) + Math.min(T.streak - 1, 5) * 10; T.score += gain; }
    else { T.streak = 0; buzz(120); }
    const fb = $('#t-fb'); fb.hidden = false; fb.className = 'fb ' + (ok ? 'good' : 'bad');
    $('#t-fbh').textContent = ok ? `Dobrze! +${gain}` : (b ? 'Nie tym razem' : 'Czas minął');
    $('#t-fbt').textContent = `${q} → ${a}`;
    const nb = $('#t-next'); nb.hidden = false; nb.textContent = T.i === T.order.length - 1 ? 'Wynik' : 'Dalej';
    nb.onclick = () => { T.i++; nextTrigger(); };
    nb.focus({ preventScroll: true });
  };
  opts.forEach(o => { const b = document.createElement('button'); b.className = 'choice'; b.textContent = o; b.onclick = () => answer(o, b); ch.appendChild(b); btns.push(b); });
  const t0 = performance.now(), bar = $('#t-bar');
  const tick = now => { const k = Math.min(1, (now - t0) / T_TIME); bar.style.transform = `scaleX(${1 - k})`; if (k >= 1) answer(null, null); else timerRAF = requestAnimationFrame(tick); };
  timerRAF = requestAnimationFrame(tick);
}
function finishTriggers() {
  const best = saved.__trig || 0, rec = T.score > best;
  if (rec) { saved.__trig = T.score; persist(); }
  T.recorded = true;
  record({ trig: T.score, game: 1, answers: T.answers, correct: T.ok, ms: performance.now() - T.t0 });
  const ov = $('#overlay');
  ov.innerHTML = `<div class="sheet">
    <h3>${rec ? 'Nowy rekord!' : 'Koniec'}</h3>
    <div class="stat"><span><b>${T.score}</b>punkty</span><span><b>${T.ok}/${T.order.length}</b>trafione</span><span><b>${Math.max(best, T.score)}</b>rekord</span></div>
    <div class="btns"><button class="btn primary" id="o-again">Jeszcze raz</button><button class="btn" id="o-menu">Menu</button></div></div>`;
  ov.hidden = false;
  $('#o-again').onclick = startTriggers;
  $('#o-menu').onclick = goHome;
}

/* ================= Konta i ranking drużyny (Supabase) ================= */
// Przeglądarka czyta tylko widok leaderboard, a zapisuje przez funkcje z supabase.sql.
const CFG = window.PRINCETON_CONFIG || {};
const C = { state: 'loading', me: null, players: [], formMode: 'login', busy: false, writing: Promise.resolve() };
const AUTH_KEY = KEY + '-auth';
let auth = null;
try { auth = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { auth = null; }
const saveAuth = a => { auth = a; try { a ? localStorage.setItem(AUTH_KEY, JSON.stringify(a)) : localStorage.removeItem(AUTH_KEY); } catch (e) {} };
let boardTab = 'pts';
try { boardTab = localStorage.getItem(KEY + '-tab') === 'try' ? 'try' : 'pts'; } catch (e) {}
const mins = ms => Math.round((ms || 0) / 60000);
const ERR = {
  BAD_LOGIN: 'Zła ksywka albo PIN.',
  LOCKED: 'Za dużo nieudanych prób. Spróbuj za 15 minut.',
  NICK_TAKEN: 'Ta ksywka jest zajęta. Jeśli jest twoja, wybierz „Mam konto”.',
  NICK_LEN: 'Ksywka musi mieć od 2 do 24 znaków.',
  PIN_FORMAT: 'PIN to dokładnie 4 cyfry.',
  NET: 'Brak połączenia z serwerem wyników. Spróbuj za chwilę.'
};

const configured = () => /^https:\/\/\S+/.test(CFG.supabaseUrl || '') && (CFG.supabaseKey || '').length > 20 && !/WKLEJ/.test(CFG.supabaseKey);
const apiBase = () => CFG.supabaseUrl.replace(/\/+$/, '') + '/rest/v1/';
function headers() {
  const h = { apikey: CFG.supabaseKey, 'Content-Type': 'application/json' };
  if (CFG.supabaseKey.startsWith('eyJ')) h.Authorization = 'Bearer ' + CFG.supabaseKey; // starszy klucz "anon"
  return h;
}
async function rpc(fn, body) {
  const r = await fetch(apiBase() + 'rpc/' + fn, { method: 'POST', headers: headers(), body: JSON.stringify(body) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function adoptMe(res) {
  const me = Object.assign({}, res); delete me.token;
  C.me = me;
  // gwiazdki z konta widać też na liście sytuacji
  let changed = false;
  Object.entries(me.stars || {}).forEach(([k, v]) => { if ((saved[k] || 0) < v) { saved[k] = v; changed = true; } });
  if ((saved.__trig || 0) < (me.trig || 0)) { saved.__trig = me.trig; changed = true; }
  if (changed) persist();
}

async function loadBoard() {
  if (!configured()) return;
  try {
    const r = await fetch(apiBase() + 'leaderboard?select=*&order=total.desc&limit=200', { headers: headers() });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    C.players = await r.json();
    C.state = 'ready';
  } catch (e) { if (C.state !== 'ready') C.state = 'offline'; }
  renderMe(); renderBoard();
}
async function initCloud() {
  if (!configured()) { C.state = 'off'; renderMe(); renderBoard(); return; }
  if (auth && auth.token) {
    try {
      const res = await rpc('get_me', { p_token: auth.token });
      if (res && res.error) saveAuth(null); else if (res) adoptMe(res);
    } catch (e) {}
  }
  await loadBoard();
  if (auth && !$('#home').hidden) renderHome();
  setInterval(() => { if (!document.hidden && !$('#home').hidden) loadBoard(); }, 30000);
}
function record(r) {
  if (!auth || !auth.token || !configured()) return;
  const p = Object.assign({}, r, { ms: Math.round(r.ms || 0) });
  C.writing = C.writing
    .then(() => rpc('record_play', { p_token: auth.token, p }))
    .then(res => {
      if (res && res.error === 'BAD_TOKEN') { saveAuth(null); C.me = null; }
      else if (res && !res.error) adoptMe(res);
      return loadBoard();
    })
    .catch(() => {});
}

function setTab(t) {
  boardTab = t;
  try { localStorage.setItem(KEY + '-tab', t); } catch (e) {}
  $('#tab-pts').setAttribute('aria-pressed', t === 'pts');
  $('#tab-try').setAttribute('aria-pressed', t === 'try');
  renderBoard();
}
function avatar(id, nick) {
  let h = 0; for (const ch of String(id || nick || '?')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const s = document.createElement('span'); s.className = 'av'; s.style.setProperty('--h', h % 360);
  s.textContent = (nick || '?').trim().charAt(0).toUpperCase() || '?';
  return s;
}

function renderMe() {
  const box = $('#me-box'); if (!box) return;
  const a = document.activeElement;
  if (a && box.contains(a) && a.tagName === 'INPUT') return; // nie przerywaj pisania
  if (C.state === 'off') {
    box.innerHTML = '<p><b>Ranking nie jest jeszcze podłączony.</b> Gra działa, a wyniki zapisują się na tym telefonie.</p>';
    return;
  }
  if (!auth) { renderAuth(box); return; }
  const me = C.me || { id: auth.id, nick: auth.nick };
  const pos = C.players.findIndex(p => p.id === me.id);
  box.innerHTML = `
    <div class="me-row"><span id="me-av"></span>
      <div class="me-name"><span id="me-nick"></span><small>${C.state === 'offline' ? 'Brak połączenia z rankingiem' : 'Zalogowany'} · <button class="linkish" id="me-out">wyloguj</button></small></div></div>
    <div class="me-stats">
      <span><b>${pos >= 0 ? '#' + (pos + 1) : '–'}</b>miejsce</span>
      <span><b>${me.total || 0}</b>punkty</span>
      <span><b>${me.games || 0}</b>gier</span>
      <span><b>${mins(me.play_ms)}</b>min gry</span>
    </div>`;
  $('#me-av').replaceWith(avatar(me.id, me.nick));
  $('#me-nick').textContent = me.nick || '';
  $('#me-out').onclick = () => { saveAuth(null); C.me = null; renderMe(); renderBoard(); };
}
function renderAuth(box) {
  const isNew = C.formMode === 'new';
  box.innerHTML = `
    <p><b>Zaloguj się, żeby trafić do rankingu.</b> Wystarczy ksywka i 4-cyfrowy PIN.</p>
    <div class="tabs" role="group" aria-label="Logowanie">
      <button type="button" id="au-login" aria-pressed="${!isNew}">Mam konto</button>
      <button type="button" id="au-new" aria-pressed="${isNew}">Nowe konto</button>
    </div>
    <form class="auth" id="au-form" novalidate>
      <input id="au-nick" maxlength="24" autocomplete="username" placeholder="Ksywka" aria-label="Ksywka">
      <input id="au-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="${isNew ? 'new-password' : 'current-password'}" placeholder="PIN, 4 cyfry" aria-label="PIN, 4 cyfry">
      <button class="btn primary" type="submit" id="au-go">${isNew ? 'Załóż konto' : 'Zaloguj'}</button>
    </form>
    ${isNew ? '<p>Zapamiętaj PIN. Jeśli go zapomnisz, trener może go zresetować.</p>' : ''}
    <p class="err" id="au-err" role="alert"></p>`;
  $('#au-login').onclick = () => { C.formMode = 'login'; renderAuth(box); };
  $('#au-new').onclick = () => { C.formMode = 'new'; renderAuth(box); };
  $('#au-form').onsubmit = async e => {
    e.preventDefault();
    if (C.busy) return;
    const nick = $('#au-nick').value.trim(), pin = $('#au-pin').value.trim(), err = $('#au-err');
    if (nick.length < 2) { err.textContent = ERR.NICK_LEN; return; }
    if (!/^[0-9]{4}$/.test(pin)) { err.textContent = ERR.PIN_FORMAT; return; }
    C.busy = true; $('#au-go').disabled = true; err.textContent = '';
    try {
      const res = await rpc(isNew ? 'register_player' : 'login_player', { p_nick: nick, p_pin: pin });
      if (res.error) { err.textContent = ERR[res.error] || ERR.NET; return; }
      saveAuth({ id: res.id, token: res.token, nick: res.nick });
      adoptMe(res);
      document.activeElement && document.activeElement.blur();
      renderHome();
      loadBoard();
    } catch (e2) {
      err.textContent = ERR.NET;
    } finally {
      C.busy = false; const b = $('#au-go'); if (b) b.disabled = false;
    }
  };
}

function renderBoard() {
  const list = $('#rank'); if (!list) return;
  if (C.state === 'loading') { list.innerHTML = '<li class="empty">Wczytuję ranking…</li>'; return; }
  if (C.state === 'off') { list.innerHTML = '<li class="empty">Ranking pojawi się, gdy gra zostanie podłączona do bazy wyników.</li>'; return; }
  if (C.state === 'offline') { list.innerHTML = '<li class="empty">Nie udało się wczytać rankingu. Sprawdź internet.</li>'; return; }
  let rows = C.players.map(p => (C.me && p.id === C.me.id) ? Object.assign({}, p, C.me) : p);
  if (boardTab === 'pts') rows.sort((a, b) => (b.total || 0) - (a.total || 0) || (b.games || 0) - (a.games || 0));
  else rows.sort((a, b) => (b.games || 0) - (a.games || 0) || (b.answers || 0) - (a.answers || 0) || (b.play_ms || 0) - (a.play_ms || 0));
  if (!rows.length) { list.innerHTML = '<li class="empty">Nikt jeszcze nie grał. Załóż konto, rozegraj sytuację i zgarnij #1.</li>'; return; }
  const myId = auth ? auth.id : null;
  list.innerHTML = '';
  rows.slice(0, 100).forEach((p, i) => {
    const li = document.createElement('li');
    if (p.id === myId) li.className = 'mine';
    const acc = p.answers ? Math.round((p.correct || 0) / p.answers * 100) : 0;
    const sub = boardTab === 'pts'
      ? `${p.stars_sum || 0} piłek · ${acc}% trafień`
      : `${p.answers || 0} odpowiedzi · ${mins(p.play_ms)} min · ${p.days_count || 0} dni`;
    const val = boardTab === 'pts' ? `${p.total || 0}<small>pkt</small>` : `${p.games || 0}<small>gier</small>`;
    li.innerHTML = `<span class="pos">${i + 1}</span><span class="avslot"></span><span class="who"><span class="nm"></span><small></small></span><span class="val">${val}</span>`;
    $('.avslot', li).replaceWith(avatar(p.id, p.nick));
    $('.nm', li).textContent = (p.nick || 'Zawodnik') + (p.id === myId ? ' (ty)' : '');
    $('small', li).textContent = sub;
    list.appendChild(li);
  });
}

/* ================= Start ================= */
renderHome();
initCloud();
const h = (location.hash || '').slice(1);
if (h === 'triggery') startTriggers();
else if (DRILLS.some(d => d.id === h)) startDrill(h, 'play');
else show('home');
})();
</script>
